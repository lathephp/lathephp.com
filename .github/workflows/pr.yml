name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The word check also reads every commit message.
          fetch-depth: 0

      # The site builds from the docs folder of lathephp/lathe at main.
      - uses: actions/checkout@v7
        with:
          repository: lathephp/lathe
          ref: main
          path: .lathe
          sparse-checkout: docs

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build smoke test
        run: pnpm check:smoke
        env:
          LATHE_DOCS_DIR: .lathe/docs

      # After the build, so the word check also scans dist/.
      - name: Word check
        run: pnpm check:words

      - name: Link check
        run: pnpm check:links
